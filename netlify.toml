# Netlify: build, functions e header (CLAUDE.md §4).
# Niente variabili segrete qui: le chiavi vanno nell'interfaccia di Netlify,
# con ambito «Functions» (le variabili di questo file non arrivano alle Functions).

[build]
  command = "node build.mjs"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sicurezza: tutte le risposte statiche.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    # Step 9 (§4). L'impronta sha256 è quella dell'unico script inline (classe «js» sull'<html>): se lo script
    # cambia, va ricalcolata (lo verifica studio/controlli.mjs). Google e Meta solo per GA4 e pixel, dopo il consenso.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U=' https://*.googletagmanager.com https://connect.facebook.net; style-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://www.facebook.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.facebook.com https://connect.facebook.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Cache: font, CSS e JS hanno ?v=<hash> nei link, quindi sono immutabili.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini: 30 giorni.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

