<div class="legale-blocco">
  <h3>{{titolo}}</h3>
  <dl class="legale-scheda">
    <div><dt>{{t.legali.etichette.dati}}</dt><dd>{{dati}}</dd></div>
    <div><dt>{{t.legali.etichette.finalita}}</dt><dd>{{finalita}}</dd></div>
    <div><dt>{{t.legali.etichette.base}}</dt><dd>{{base}}</dd></div>
    <div><dt>{{t.legali.etichette.conservazione}}</dt><dd>{{conservazione}}</dd></div>
  </dl>
  {{#se nota}}<p class="legale-nota">{{nota}}</p>
  {{/se}}
</div>
